# Opcional: se o projeto estiver no GitHub, gera o .exe automaticamente num Windows da nuvem.
name: Build CND_Goiania.exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CND_Goiania --add-data "config.json;." --add-data "assets;assets" --icon assets/icone.ico --collect-all selenium app.py
      - run: copy config.json dist\config.json
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: CND_Goiania
          path: dist/
